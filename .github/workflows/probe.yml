name: Probe meal API
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 3
    steps:
      - name: Test Webetu connection
        env:
          WEBETU_HMAC_KEY: ${{ secrets.WEBETU_HMAC_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          import uuid

          url = 'https://api-webetu.mesrs.dz/api/authentication/v1/'
          wire = json.dumps({'username': '__connectivity_probe__', 'password': 'invalid'}, separators=(',', ':'))
          ts, nonce = str(int(time.time())), str(uuid.uuid4())
          key = os.environ['WEBETU_HMAC_KEY'].encode()
          signature = hmac.new(key, f'{ts}|{nonce}|{wire}'.encode(), hashlib.sha256).hexdigest()
          request = urllib.request.Request(url, data=wire.encode(), headers={
              'X-Timestamp': ts, 'X-Nonce': nonce, 'X-Signature': signature,
              'Content-Type': 'application/json', 'Accept': 'application/json, text/plain, */*',
              'User-Agent': 'okhttp/4.12.0',
          }, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=12) as response:
                  print('HTTP status:', response.status)
          except urllib.error.HTTPError as exc:
              print('HTTP status:', exc.code)
          except Exception as exc:
              print('Connection error:', type(exc).__name__, str(exc)[:180])
              raise SystemExit(1)
          PY
